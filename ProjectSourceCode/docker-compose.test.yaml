services:
  db-test:
    image: postgres:17.6
    env_file: .env.test
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - lab10-test-db:/var/lib/postgresql/data
      - ./create.sql:/docker-entrypoint-initdb.d/create.sql:ro # same schema as the dev db

  tests:
    image: node:22.19.0-bookworm
    working_dir: /repository/ProjectSourceCode
    env_file: .env.test
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ../.:/repository
      - lab10-test-node-modules:/repository/ProjectSourceCode/node_modules
    command: ['npm', 'test']

volumes:
  lab10-test-db:
  lab10-test-node-modules: